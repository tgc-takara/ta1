<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名刺管理</title>
<?!= include('client.css'); ?>
</head>
<body>
  <header class="topbar">
    <h1>名刺管理</h1>
    <nav>
      <button class="tab active" data-tab="list">一覧</button>
      <button class="tab" data-tab="capture">動画で追加</button>
      <button class="tab" data-tab="photo">写真で追加</button>
    </nav>
  </header>

  <main>
    <!-- 一覧タブ -->
    <section id="tab-list" class="tab-pane active">
      <div class="list-controls">
        <input id="searchInput" type="search" placeholder="氏名 / 会社 / タグで検索">
        <div id="tagChips" class="tag-chips"></div>
        <button id="reloadBtn" class="ghost">再読込</button>
      </div>
      <div id="cardList" class="card-list" aria-live="polite"></div>
    </section>

    <!-- 動画追加タブ -->
    <section id="tab-capture" class="tab-pane">
      <div class="capture">
        <video id="preview" playsinline autoplay muted></video>
        <div class="capture-controls">
          <button id="startRec" class="primary">録画開始</button>
          <button id="stopRec" class="danger" disabled>停止</button>
          <span id="recTimer" class="timer">00:00</span>
        </div>
        <p class="hint">
          名刺を1枚あたり1〜2秒ずつ正対させてください。推奨：60秒以内、20〜30枚まで。
        </p>
        <div id="captureStatus" class="status"></div>
        <video id="recorded" controls playsinline class="hidden"></video>
        <div class="capture-actions">
          <button id="processBtn" class="primary" disabled>アップロード → 抽出</button>
        </div>
      </div>
      <div id="reviewArea" class="review hidden">
        <h2>検出結果のレビュー</h2>
        <div id="reviewList" class="review-list"></div>
        <div class="review-actions">
          <button id="saveAllBtn" class="primary">全件保存</button>
          <button id="cancelReviewBtn" class="ghost">キャンセル</button>
        </div>
      </div>
    </section>

    <!-- 写真1枚追加タブ -->
    <section id="tab-photo" class="tab-pane">
      <div class="photo-upload">
        <input id="photoInput" type="file" accept="image/*" capture="environment">
        <button id="photoProcessBtn" class="primary" disabled>この画像を抽出</button>
        <div id="photoStatus" class="status"></div>
        <img id="photoPreview" class="hidden" alt="preview">
      </div>
      <div id="photoReview" class="review hidden">
        <h2>検出結果の確認</h2>
        <div id="photoReviewCard" class="review-list"></div>
        <div class="review-actions">
          <button id="photoSaveBtn" class="primary">保存</button>
          <button id="photoCancelBtn" class="ghost">キャンセル</button>
        </div>
      </div>
    </section>

    <!-- 編集モーダル -->
    <div id="editModal" class="modal hidden">
      <div class="modal-body">
        <h2>編集</h2>
        <div id="editForm" class="form"></div>
        <div class="modal-actions">
          <button id="editSaveBtn" class="primary">保存</button>
          <button id="editDeleteBtn" class="danger">削除</button>
          <button id="editCancelBtn" class="ghost">閉じる</button>
        </div>
      </div>
    </div>

    <div id="toast" class="toast"></div>
  </main>

  <?!= include('client.js'); ?>
  <?!= include('videoCapture.js'); ?>
</body>
</html>
