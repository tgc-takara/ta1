<style>
  :root {
    --bg: #f6f7f9;
    --surface: #fff;
    --border: #e4e7eb;
    --text: #1f2328;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --danger: #dc2626;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif; font-size: 14px; }
  .topbar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 16px; margin: 0; }
  .topbar nav { display: flex; gap: 4px; flex: 1; justify-content: flex-end; }
  .tab { background: transparent; border: 1px solid transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
  .tab.active { background: #eef2ff; color: var(--primary); border-color: #c7d2fe; }
  main { padding: 12px; max-width: 960px; margin: 0 auto; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .list-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .list-controls input[type="search"] { flex: 1; min-width: 180px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
  .tag-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; box-shadow: var(--shadow); cursor: pointer; }
  .card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; background: #eee; }
  .card .name { font-weight: 600; margin-top: 6px; }
  .card .company { color: var(--muted); font-size: 13px; }
  .card .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .card .tags .chip { font-size: 11px; padding: 2px 6px; }

  button { font: inherit; }
  .primary { background: var(--primary); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  .primary:hover { background: var(--primary-hover); }
  .primary:disabled { background: #9ca3af; cursor: not-allowed; }
  .ghost { background: transparent; border: 1px solid var(--border); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  .danger { background: var(--danger); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }

  .capture video { width: 100%; max-height: 50vh; background: #000; border-radius: 8px; }
  .capture-controls { display: flex; gap: 8px; align-items: center; margin: 10px 0; }
  .timer { font-variant-numeric: tabular-nums; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; }
  .capture-actions { margin-top: 8px; }
  .hidden { display: none !important; }
  .status { margin: 8px 0; color: var(--muted); font-size: 13px; white-space: pre-wrap; }

  .review-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .review-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .review-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 4px; background: #eee; }
  .review-card .row { display: flex; gap: 6px; margin-top: 4px; }
  .review-card .row label { width: 70px; color: var(--muted); font-size: 12px; align-self: center; }
  .review-card .row input, .review-card .row textarea { flex: 1; padding: 4px 6px; border: 1px solid var(--border); border-radius: 4px; background: #fafbfc; }
  .review-card .drop { text-align: right; }
  .review-actions { margin-top: 12px; display: flex; gap: 8px; }

  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 12px; }
  .modal-body { background: var(--surface); border-radius: 8px; padding: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow: auto; }
  .form { display: grid; grid-template-columns: 120px 1fr; gap: 6px 10px; }
  .form label { align-self: center; color: var(--muted); font-size: 12px; }
  .form input, .form textarea { padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; background: #fafbfc; font: inherit; }
  .form img { grid-column: 1 / -1; width: 100%; max-height: 240px; object-fit: contain; background: #eee; border-radius: 4px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end; }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #111; color: #fff; padding: 8px 12px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
  .toast.show { opacity: 1; }
</style>
