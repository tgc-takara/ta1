# XcodeGen 定義。Mac 上で `xcodegen generate` を実行すると TrackStack.xcodeproj が生成される。
# インストール: brew install xcodegen
name: TrackStack
options:
  bundleIdPrefix: com.taguchi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  TrackStack:
    type: application
    platform: iOS
    sources:
      - path: TrackStack
    info:
      path: TrackStack/Info.plist
      properties:
        CFBundleDisplayName: TrackStack
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone のみ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 実機インストール用の署名設定(Personal Team。無料枠のため7日でアプリが失効する)
        DEVELOPMENT_TEAM: MR4452D97Q
        CODE_SIGN_STYLE: Automatic
  TrackStackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrackStackTests
    dependencies:
      - target: TrackStack
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrackStack:
    build:
      targets:
        TrackStack: all
    test:
      targets:
        - TrackStackTests
