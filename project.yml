# XcodeGen 定義。Mac 上で `xcodegen generate` を実行すると TrackStack.xcodeproj が生成される。
# インストール: brew install xcodegen
name: TrackStack
options:
  bundleIdPrefix: com.taguchi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  TrackStack:
    type: application
    platform: iOS
    sources:
      - path: TrackStack
    info:
      path: TrackStack/Info.plist
      properties:
        CFBundleDisplayName: "ひとつみ"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # ウィジェットからのディープリンク用 URL スキーム(DeepLink.swift が解釈する)
        CFBundleURLTypes:
          - CFBundleURLName: com.taguchi.TrackStack
            CFBundleURLSchemes:
              - hitotsumi
        # 自動バックアップ(BGAppRefreshTask)用
        BGTaskSchedulerPermittedIdentifiers:
          - com.taguchi.TrackStack.autobackup
        UIBackgroundModes:
          - fetch
    entitlements:
      path: TrackStack/TrackStack.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taguchi.TrackStack
    dependencies:
      - target: TrackStackWidget
        embed: true
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone のみ
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 実機インストール用の署名設定(Personal Team。無料枠のため7日でアプリが失効する)
        DEVELOPMENT_TEAM: MR4452D97Q
        CODE_SIGN_STYLE: Automatic
  TrackStackWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TrackStackWidget
      # アプリ本体と共有するファイル(SwiftData に依存しないものだけ)
      - path: TrackStack/Models/ActivityCategory.swift
      - path: TrackStack/Shared/Theme.swift
      - path: TrackStack/Shared/Formatters.swift
      - path: TrackStack/Shared/WidgetSnapshot.swift
    info:
      path: TrackStackWidget/Info.plist
      properties:
        CFBundleDisplayName: "ひとつみ"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TrackStackWidget/TrackStackWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.taguchi.TrackStack
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1" # iPhone のみ
        PRODUCT_BUNDLE_IDENTIFIER: com.taguchi.TrackStack.Widget
        DEVELOPMENT_TEAM: MR4452D97Q
        CODE_SIGN_STYLE: Automatic
  TrackStackTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TrackStackTests
    dependencies:
      - target: TrackStack
    settings:
      base:
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TrackStack:
    build:
      targets:
        TrackStack: all
        TrackStackWidget: all
    test:
      targets:
        - TrackStackTests
